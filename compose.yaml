# Local orchestrator stack: InfluxDB, Ignite, and GraphQL API.
# DDS Python scripts run on the host (WSL on Windows), not in Docker.
# Pulls matt_python from GHCR (see README). Requires dds/dds_env.sh and compose
# env vars for Influx (INFLUXDB_USERNAME, INFLUXDB_PASSWORD, INFLUXDB_TOKEN).
x-matt-python-image: &matt_python_image ghcr.io/satomm1/matt_python:1.1.0

services:

  ignite_dds:
    image: apacheignite/ignite:latest
    hostname: ignite_host
    container_name: ignite_dds
    ports:
      - "10800:10800"
    restart: always
    volumes:
      - ./ignite:/storage
    environment:
      - "IGNITE_WORK_DIR=/storage"

  graphql_endpoint_dds:
    image: *matt_python_image
    container_name: graphql_endpoint_dds
    hostname: graphql_endpoint
    ports:
      - "8000:8000"
      - "4000:4000"
    volumes: 
      - ./graphql:/home
      - robot_images_data:/data/robot_images
    environment:
      - ROBOT_IMAGE_DIR=/data/robot_images
      - PUBLIC_API_BASE=http://localhost:8000
    stdin_open: true  # docker run -i
    tty: true         # docker run -t
    working_dir: /home/python-graphql
    command: /bin/sh -c 'python3 server.py'

  influx:
    image: influxdb:2
    hostname: influx_host
    container_name: influx
    ports:
      - "8086:8086"  # InfluxDB API port
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: satomm
      DOCKER_INFLUXDB_INIT_PASSWORD: mattmatt
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: Wcm_AM_NDb1bII_XFt8FTD6tL3VLG8AJyK_FOhHffGYXCdMgZsd1ZRA0EOfEic4xWbCTwudPzumI4ycyopkulA==
      DOCKER_INFLUXDB_INIT_ORG: eig
      DOCKER_INFLUXDB_INIT_BUCKET: home
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2


volumes:
  influxdb_data:
  influxdb_config:
  robot_images_data:
