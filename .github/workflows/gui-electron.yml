name: GUI Electron installers

on:
  push:
    paths:
      - "gui/**"
      - ".github/workflows/gui-electron.yml"
  pull_request:
    paths:
      - "gui/**"
      - ".github/workflows/gui-electron.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: gui

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Linux dependencies (AppImage / FUSE)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gui-installer-${{ matrix.os }}
          path: gui/electron-dist/
          if-no-files-found: error
